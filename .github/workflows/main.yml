name: SecondChance CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --log-driver json-file
          --log-opt max-size=4k
          --log-opt max-file=1
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and lint JavaScript
        run: |
          npm install --no-save eslint@8 eslint-config-standard@17 eslint-plugin-import@2 eslint-plugin-n@16 eslint-plugin-promise@6
          npx eslint secondChance-backend/{app.js,logger.js,models/db.js,routes,middleware,util/import-mongo/index.js} sentiment/index.js secondChanceWebsite/index.js
      - name: Install service dependencies
        run: |
          npm ci --prefix secondChance-backend
          npm ci --prefix sentiment
          npm ci --prefix secondChanceWebsite
      - name: Import and verify 16 MongoDB documents
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          MONGO_DB: secondChance
        run: |
          npm start --prefix secondChance-backend/util/import-mongo | tee /tmp/secondchance-import.log
          grep -Fx 'Inserted documents: 16' /tmp/secondchance-import.log
          node -e 'const { MongoClient } = require("./secondChance-backend/node_modules/mongodb"); (async () => { const client = new MongoClient(process.env.MONGO_URL); try { await client.connect(); const count = await client.db(process.env.MONGO_DB).collection("secondChanceItems").countDocuments(); require("node:assert/strict").equal(count, 16); console.log(`Verified ${count} documents in secondChance.secondChanceItems`); } finally { await client.close(); } })().catch(error => { console.error(error); process.exitCode = 1; });'
      - name: Build the React client
        run: |
          npm ci --legacy-peer-deps --prefix secondChance-frontend
          npm run build --prefix secondChance-frontend
        env:
          CI: 'false'
      - name: Build application containers
        run: |
          docker build --quiet -t secondchance-backend ./secondChance-backend
          docker build --quiet -t secondchance-website -f secondChanceWebsite/Dockerfile .
